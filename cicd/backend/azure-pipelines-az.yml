# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- rewrite

pool:
  vmImage: windows-latest

steps:
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: 'dotnet tool install --global dotnet-ef'
- task: PowerShell@2
  displayName: 'Run command db build scripts'
  env:
    MSBuildBinPath: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\
  inputs:
    filePath: 'backend\src\Database\Command\Scripts\build\Build2.ps1'
    workingDirectory: 'backend\src\Database\Command\Scripts\build'
- task: SqlAzureDacpacDeployment@1
  inputs:
    azureSubscription: 'Sandbox A1(2c929c60-4abb-4097-9f96-cca3b55eb871)'
    AuthenticationType: 'server'
    ServerName: 'auctionhouse-sql.database.windows.net'
    DatabaseName: 'Auctionhouse'
    SqlUsername: 'azureadm'
    SqlPassword: '$(pass)'
    deployType: 'DacpacTask'
    DeploymentAction: 'Publish'
    DacpacFile: 'backend\src\Database\Command\AuctionhouseDatabase\bin\Debug\AuctionhouseDatabase.dacpac'
    AdditionalArguments: '/p:ScriptDatabaseOptions=False'
    IpDetectionMethod: 'AutoDetect'
